<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hollow Vigil</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --void:#060509; --ash:#121017; --ash-2:#1b1822; --ash-3:#27222f;
  --bone:#ece2cc; --bone-dim:#a59c8b; --bone-faint:#6a6358;
  --ember:#ff7a38; --gold:#d9a84e; --gold-dim:#8b6a32; --blood:#b3142e; --blood-hot:#ff3552;
  --rime:#9fe6ff; --hex:#a877ff; --verd:#79c2a0; --holy:#ffe9a8;
  --f-display:"Grenze Gotisch","UnifrakturMaguntia","Old English Text MT",Georgia,serif;
  --f-body:"Cormorant Garamond",Garamond,"Times New Roman",serif;
  --f-ui:"Barlow Semi Condensed","Arial Narrow","Segoe UI",sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);overflow:hidden;color:var(--bone);font-family:var(--f-ui);}
body{-webkit-user-select:none;user-select:none;touch-action:none;}
#app{position:fixed;inset:0;}
#app canvas{position:absolute;inset:0;display:block;width:100%;height:100%;}
#fx2d{pointer-events:none;z-index:2;}
#hud{z-index:3;}
#screens{position:absolute;inset:0;z-index:10;pointer-events:none;}
button{font:inherit;color:inherit;}
button:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}

/* ——— HUD ——— */
#hud{position:absolute;inset:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px) 0;pointer-events:none;}
.xp{position:absolute;left:0;right:0;top:0;height:7px;background:linear-gradient(#0a080d,#15111a);border-bottom:1px solid #3b2f22;}
.xp .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#4a2a88,#9a6bff 70%,#e2d2ff);box-shadow:0 0 12px #9a6bff;transition:width .12s linear;}
.xp .fill::after{content:"";position:absolute;right:0;top:-3px;bottom:-3px;width:3px;background:#fff;box-shadow:0 0 10px 3px #c7adff;}
.lvl{position:absolute;left:16px;top:14px;display:flex;align-items:baseline;gap:8px;}
.lvl b{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;color:var(--bone);text-shadow:0 0 18px rgba(168,119,255,.55);}
.lvl span{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--bone-dim);}
.clock{position:absolute;left:50%;top:12px;transform:translateX(-50%);text-align:center;}
.clock .t{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #000,0 0 22px rgba(0,0,0,.9);}
.clock .phase{font-family:var(--f-body);font-style:italic;font-size:15px;color:var(--bone-dim);margin-top:2px;}
.tally{position:absolute;right:16px;top:14px;display:flex;gap:18px;font-variant-numeric:tabular-nums;}
.tally div{display:flex;align-items:center;gap:6px;font-weight:600;font-size:17px;}
.tally svg{width:16px;height:16px;}
.tally .g{color:var(--gold);}
.boss{position:absolute;left:50%;top:78px;transform:translateX(-50%);width:min(620px,86vw);text-align:center;}
.boss .name{font-family:var(--f-display);font-size:26px;letter-spacing:.04em;color:#f4e3c2;text-shadow:0 0 14px rgba(179,20,46,.7),0 2px 0 #000;}
.boss .epi{font-family:var(--f-body);font-style:italic;font-size:14px;color:var(--bone-dim);margin:-2px 0 6px;}
.boss .bar{position:relative;height:12px;background:#0d0a0e;border:1px solid #5a4630;box-shadow:0 0 0 1px #000,0 0 24px rgba(0,0,0,.8);}
.boss .bar i{position:absolute;inset:0;right:auto;width:100%;background:linear-gradient(#ff4a5e,#8e0f22 60%,#5a0714);transition:width .15s;}
.boss .bar u{position:absolute;inset:0;right:auto;width:100%;background:#f3d9b0;opacity:.55;transition:width .6s .25s;}
.boss .bar .ph{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--gold);box-shadow:0 0 6px var(--gold);}
.vitals{position:absolute;left:16px;bottom:18px;width:min(330px,60vw);}
.hp{position:relative;height:20px;background:#0b080b;border:1px solid #6b4f2c;box-shadow:inset 0 0 0 1px #000,0 6px 22px rgba(0,0,0,.7);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);}
.hp i{position:absolute;inset:0;right:auto;width:100%;background:linear-gradient(#ff4d5f,#b3142e 55%,#620a18);transition:width .1s;}
.hp u{position:absolute;inset:0;right:auto;width:100%;background:#fff1d6;opacity:.6;transition:width .5s .2s;}
.hp em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:13px;letter-spacing:.08em;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums;}
.hp.low{animation:pulse 0.9s infinite;}
@keyframes pulse{50%{box-shadow:inset 0 0 0 1px #000,0 0 26px rgba(255,40,70,.8);}}
.abil{display:flex;gap:10px;margin-top:9px;align-items:center;}
.pip{width:34px;height:34px;position:relative;display:grid;place-items:center;border:1px solid #5a4630;background:#0e0b10;transform:rotate(45deg);}
.pip svg{transform:rotate(-45deg);width:18px;height:18px;opacity:.9;}
.pip .cd{position:absolute;inset:0;background:rgba(0,0,0,.72);transform-origin:bottom;}
.pip.ult{width:40px;height:40px;border-color:var(--gold-dim);}
.pip.ult.ready{border-color:var(--gold);box-shadow:0 0 18px rgba(217,168,78,.8);animation:glowp 1.2s infinite;}
@keyframes glowp{50%{box-shadow:0 0 30px rgba(255,210,120,1);}}
.key{font-size:10px;letter-spacing:.2em;color:var(--bone-faint);text-transform:uppercase;margin-right:4px;}
.loadout{position:absolute;right:16px;bottom:18px;display:grid;gap:6px;justify-items:end;}
.slots{display:flex;gap:5px;}
.slot{width:40px;height:40px;position:relative;background:linear-gradient(#17131b,#0c0a0e);border:1px solid #3a2f25;display:grid;place-items:center;}
.slot.small{width:30px;height:30px;}
.slot svg{width:62%;height:62%;}
.slot.evo{border-color:var(--gold);box-shadow:0 0 12px rgba(217,168,78,.5);}
.slot .lv{position:absolute;right:2px;bottom:0;font-size:11px;font-weight:700;color:var(--bone);text-shadow:0 0 3px #000,0 0 3px #000;}
.slot .cdm{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);}
.slot.empty{opacity:.35;}
.toasts{position:absolute;left:50%;top:30%;transform:translateX(-50%);display:grid;gap:8px;justify-items:center;width:90vw;}
.toast{font-family:var(--f-display);font-size:30px;letter-spacing:.03em;text-align:center;text-shadow:0 0 20px rgba(0,0,0,1),0 2px 0 #000;animation:toast 3.2s forwards;}
.toast small{display:block;font-family:var(--f-body);font-style:italic;font-size:16px;color:var(--bone-dim);}
.toast.syn{font-size:22px;color:var(--gold);}
@keyframes toast{0%{opacity:0;transform:translateY(10px) scale(.96);letter-spacing:.2em}12%{opacity:1;transform:none;letter-spacing:.03em}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.flashv{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,240,210,.0) 30%,rgba(255,230,180,.5));opacity:0;}

/* ——— Screens ——— */
#screens > section{position:absolute;inset:0;display:flex;align-items:safe center;justify-content:center;padding-inline:16px;padding-block:24px;box-sizing:border-box;overflow-y:auto;pointer-events:auto;}
.char svg,.chip svg,.hint svg{width:14px;height:14px;vertical-align:-2px;}
.veil{background:radial-gradient(ellipse at 50% 40%,rgba(10,8,14,.35),rgba(4,3,6,.92) 75%);}
.veil-soft{background:radial-gradient(ellipse at 50% 50%,rgba(8,6,12,.55),rgba(4,3,6,.85));backdrop-filter:blur(2px);}
.stack{display:grid;gap:18px;justify-items:center;text-align:center;max-width:980px;width:100%;}
.title h1{font-family:var(--f-display);font-weight:900;font-size:clamp(56px,11vw,132px);line-height:.85;margin:0;letter-spacing:.01em;color:var(--bone);text-shadow:0 0 40px rgba(255,122,56,.35),0 4px 0 #000;}
.title .sub{font-family:var(--f-body);font-style:italic;font-size:clamp(16px,2.2vw,21px);color:var(--bone-dim);max-width:52ch;}
.eyebrow{font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);}
.menu{display:grid;gap:4px;margin-top:10px;min-width:240px;}
.mbtn{background:none;border:0;padding:8px 18px;font-family:var(--f-display);font-size:26px;color:var(--bone-dim);cursor:pointer;position:relative;transition:color .15s,letter-spacing .2s;}
.mbtn:hover,.mbtn:focus-visible{color:var(--bone);letter-spacing:.04em;outline:none;}
.mbtn:hover::before,.mbtn:focus-visible::before{content:"";position:absolute;left:50%;bottom:4px;width:40%;height:1px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,var(--ember),transparent);}
.mbtn[disabled]{opacity:.35;cursor:default;}
.foot{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.14em;color:var(--bone-faint);text-transform:uppercase;}
.hdr{font-family:var(--f-display);font-size:clamp(34px,5vw,54px);margin:0;line-height:1;}
.hdr small{display:block;font-family:var(--f-body);font-style:italic;font-weight:500;font-size:17px;color:var(--bone-dim);margin-top:6px;letter-spacing:0;}
.cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
.card{--rc:#6c5a44;width:220px;min-height:min(290px,52vh);background:linear-gradient(180deg,#1a1620,#0d0b10 70%);border:1px solid var(--rc);position:relative;padding:18px 16px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:transform .18s,box-shadow .18s,border-color .18s;box-shadow:0 20px 40px rgba(0,0,0,.6);animation:cardin .45s both;}
.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.18s}
@keyframes cardin{from{opacity:0;transform:translateY(24px) rotateX(20deg)}to{opacity:1;transform:none}}
.card:hover,.card.sel{transform:translateY(-8px);box-shadow:0 26px 50px rgba(0,0,0,.7),0 0 0 1px var(--rc),0 0 34px color-mix(in srgb,var(--rc) 45%,transparent);}
.card::before{content:"";position:absolute;inset:5px;border:1px solid color-mix(in srgb,var(--rc) 35%,transparent);pointer-events:none;}
.card .ic{width:56px;height:56px;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--rc) 60%,transparent);transform:rotate(45deg);margin:6px 0 10px 10px;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 30%,transparent),transparent 70%);}
.card .ic svg{transform:rotate(-45deg);width:30px;height:30px;}
.card .rar{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--rc);}
.card h3{margin:0;font-family:var(--f-display);font-size:25px;font-weight:700;line-height:1.05;color:var(--bone);}
.card .tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone-faint);}
.card p{margin:0;font-family:var(--f-body);font-size:16.5px;line-height:1.3;color:#d4cab5;}
.card p b{color:var(--bone);font-weight:600;}
.card .lore{margin-top:auto;font-style:italic;font-size:14px;color:var(--bone-faint);}
.card.r-rare{--rc:#5aa0ff}.card.r-epic{--rc:#c070ff}.card.r-arcana{--rc:#e6b24f;background:linear-gradient(180deg,#241b10,#0d0b10 75%)}.card.r-evo{--rc:#ff6a3a}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.sbtn{background:#141018;border:1px solid #4a3c2c;padding:9px 16px;font-size:14px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;color:var(--bone-dim);}
.sbtn:hover{color:var(--bone);border-color:var(--gold-dim);}
.sbtn.prim{border-color:var(--ember);color:var(--bone);background:linear-gradient(#2a1510,#150c0c);}
.sbtn[disabled]{opacity:.35;cursor:default;}
.chars{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.char{width:200px;padding:14px;border:1px solid #3a2f25;background:#100d13;text-align:left;cursor:pointer;display:grid;gap:6px;}
.char.on{border-color:var(--gold);box-shadow:0 0 24px rgba(217,168,78,.25);background:linear-gradient(180deg,#1d1610,#100d13 60%);}
.char .sig{width:38px;height:38px;display:grid;place-items:center;border:1px solid currentColor;transform:rotate(45deg);margin:4px 0 8px 6px;opacity:.9;}
.char .sig svg{transform:rotate(-45deg);width:22px;height:22px;}
.cstats{display:flex;gap:10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-faint);}
.purse svg{width:18px;height:18px;}
.up h4 span,.char h4{text-wrap:balance;}
.char.locked{opacity:.5;}
.char h4{margin:0;font-family:var(--f-display);font-size:23px;}
.char .cls{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);}
.char p{margin:0;font-family:var(--f-body);font-size:15px;color:var(--bone-dim);line-height:1.25;}
.opts{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;text-align:left;}
.opt h5{margin:0 0 6px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--bone-faint);font-weight:600;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;margin:0 6px 6px 0;border:1px solid #3a2f25;background:#100d13;cursor:pointer;font-size:14px;color:var(--bone-dim);}
.chip.on{border-color:var(--ember);color:var(--bone);background:#1f110d;}
.chip.locked{opacity:.4;cursor:default;}
.chip i{font-style:normal;color:var(--gold);font-size:12px;}
.panel{background:rgba(12,10,15,.86);border:1px solid #3a2f25;padding:18px 20px;text-align:left;}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;width:100%;}
.statlist{display:grid;grid-template-columns:1fr auto;gap:3px 18px;font-size:14px;font-variant-numeric:tabular-nums;}
.statlist dt{color:var(--bone-dim);}
.statlist dd{margin:0;text-align:right;color:var(--bone);}
.build{display:flex;flex-wrap:wrap;gap:6px;}
.syn{font-family:var(--f-body);font-size:15px;color:var(--bone-dim);margin:4px 0 0;padding-left:0;list-style:none;}
.syn li{margin:3px 0;}
.syn li b{color:var(--gold);font-weight:600;}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;width:100%;max-height:52vh;overflow:auto;padding:2px;}
.up{border:1px solid #3a2f25;background:#100d13;padding:12px;text-align:left;display:grid;gap:5px;cursor:pointer;}
.up:hover{border-color:var(--gold-dim);}
.up.max{opacity:.55;cursor:default;}
.up h4{margin:0;font-family:var(--f-display);font-size:21px;display:flex;justify-content:space-between;align-items:baseline;}
.up h4 span{font-family:var(--f-ui);font-size:12px;color:var(--bone-faint);letter-spacing:.1em;}
.up p{margin:0;font-family:var(--f-body);font-size:15px;color:var(--bone-dim);}
.up .cost{font-weight:700;color:var(--gold);font-size:14px;}
.up .cost.no{color:#7a5a4a;}
.ranks{display:flex;gap:3px;}
.ranks i{width:14px;height:4px;background:#2a2320;}
.ranks i.f{background:var(--gold);}
.purse{font-size:20px;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:8px;}
.bigstat{font-family:var(--f-display);font-size:64px;line-height:1;}
.dmgrow{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:14px;margin:4px 0;}
.dmgrow svg{width:18px;height:18px;}
.dmgbar{height:4px;background:#2a2026;margin-top:2px;}
.dmgbar i{display:block;height:100%;background:var(--ember);}
.unl{color:var(--gold);font-family:var(--f-body);font-size:17px;}
.hint{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-faint);}
.touchpad{position:absolute;inset:0;pointer-events:none;}
.stick{position:absolute;width:110px;height:110px;border-radius:50%;border:1px solid rgba(236,226,204,.25);transform:translate(-50%,-50%);}
.stick i{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border-radius:50%;background:rgba(236,226,204,.25);}
.tbtn{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;border:1px solid rgba(236,226,204,.35);background:rgba(20,16,24,.5);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-dim);}
.loading{font-family:var(--f-body);font-style:italic;color:var(--bone-dim);font-size:20px;}
@media (max-height:620px){ .card{min-height:0;padding:12px 14px} .card .ic{width:40px;height:40px;margin:2px 0 4px 6px} .card .lore{display:none} .stack{gap:10px} .title h1{font-size:clamp(48px,9vw,96px)} }
@media (max-width:640px){
  .card{width:min(100%,340px);min-height:0}
  .loadout{bottom:84px}
  .clock .t{font-size:30px}
  .lvl b{font-size:26px}
}
@media (prefers-reduced-motion:reduce){ .card,.toast{animation-duration:.01s} }
</style>
</head>
<body>

<div id="app">
  <div id="screens"><section class="veil" id="boot"><div class="loading">The candles are being lit…</div></section></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
